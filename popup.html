<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fcfcfd;
        --ink: #101014;
        --ink-2: #5b5b66;
        --muted: #9a9aa5;
        --line: #e8e8ee;
        --wash: #f4f4f7;
        --accent: #2f2be0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 268px;
        margin: 0;
        padding: 16px;
        background: var(--paper);
        color: var(--ink);
        font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        letter-spacing: -0.005em;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .count {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #26262e;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      a {
        display: block;
        margin-top: 10px;
        text-align: center;
        color: var(--ink-2);
        text-decoration: none;
        font-size: 12px;
      }
      a:hover {
        color: var(--accent);
      }
      .note {
        margin: 10px 0 0;
        font-size: 11px;
        line-height: 1.45;
        color: var(--muted);
        text-align: center;
      }
      .note[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Type library</h1>
      <span class="count" id="count"></span>
    </header>
    <button id="pick">Pick a font on this page</button>
    <a href="#" id="open">Open library</a>
    <p class="note" id="note" hidden></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
